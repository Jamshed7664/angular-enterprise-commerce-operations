<app-page-header eyebrow="Refunds" title="Refund queue" description="Track partial and full refunds associated with orders and returns."/>
<div class="card data-grid">
  <table>
    <thead>
      <tr>
        <th>
          Refund
        </th>
        <th>
          Order
        </th>
        <th>
          Amount
        </th>
        <th>
          Reason
        </th>
        <th>
          Status
        </th>
        <th>
          Created
        </th>
      </tr>
    </thead>
    <tbody>
      @for(r of items();track r.id){
        <tr [routerLink]="['/orders',r.orderId]">
          <td>
            #
            {{r.id}}
          </td>
          <td>
            #
            {{r.orderId}}
          </td>
          <td>
            <b>
              {{r.amount|currency:'USD'}}
            </b>
          </td>
          <td>
            {{r.reason}}
          </td>
          <td>
            <app-status-chip [status]="r.status"/>
          </td>
          <td>
            {{r.createdAt|date:'mediumDate'}}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
