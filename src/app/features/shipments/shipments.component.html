<app-page-header eyebrow="Shipping" title="Shipments" description="Carrier, tracking and delivery timelines across fulfilled orders."/>
<div class="card data-grid">
  <table>
    <thead>
      <tr>
        <th>
          Tracking
        </th>
        <th>
          Order
        </th>
        <th>
          Carrier
        </th>
        <th>
          Service
        </th>
        <th>
          Status
        </th>
        <th>
          ETA
        </th>
      </tr>
    </thead>
    <tbody>
      @for(s of items();track s.id){
        <tr [routerLink]="['/orders',s.orderId]">
          <td>
            <b>
              {{s.trackingNumber}}
            </b>
          </td>
          <td>
            #
            {{s.orderId}}
          </td>
          <td>
            {{s.carrier}}
          </td>
          <td>
            {{s.serviceLevel}}
          </td>
          <td>
            <app-status-chip [status]="s.status"/>
          </td>
          <td>
            {{s.estimatedDelivery|date:'mediumDate'}}
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
